# Python packages needed by the ESP32 core's build tools (not by the firmware).
# On Linux, esp32 core 2.0.17 runs esptool.py with the first "python" on PATH, and esptool
# needs pyserial to build the firmware image and to upload it.
#
#   uv sync                                          # create .venv with the packages below
#   uv run arduino-cli compile --profile miniskidi   # .venv/bin is first on PATH
#   uv run arduino-cli upload --profile miniskidi -p /dev/ttyUSB0
[project]
name = "miniskidi-build-tools"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyserial==3.5",
]

[tool.uv]
package = false # only a tool environment, nothing to build or install
