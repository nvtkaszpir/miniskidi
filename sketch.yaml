# Build with pinned dependencies:  arduino-cli compile --profile miniskidi
# Upload:                          arduino-cli upload --profile miniskidi -p /dev/ttyUSB0
profiles:
  miniskidi:
    notes: ESP32-WROOM-32D ("ESP32 Dev Module")
    fqbn: esp32:esp32:esp32:DebugLevel=info # core/library log level, keep in sync with LOG_LEVEL in MiniSkidi_3_0.ino
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ESP32Servo (3.2.1)
      - ESPAsyncWebSrv (1.2.9)
      - AsyncTCP (1.1.4)

default_profile: miniskidi
default_fqbn: esp32:esp32:esp32
